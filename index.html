<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>抽卡</title>
<style>
  :root { --bg: #f2f0e9; --paper: #fffdf7; --ink: #1f2a37; --muted: #7b8494; --accent: #2f5d8a; --line: #e0dccf; --bad: #b54a3c;
    --sans: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", sans-serif; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12161c; --paper: #1a2029; --ink: #e4e8ee; --muted: #8b94a3; --accent: #8ab4e0; --line: #2a3340; --bad: #ef9384; color-scheme: dark; }
  }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { background: var(--bg); color: var(--ink); font-family: var(--sans); display: grid; place-items: center; padding: 16px; box-sizing: border-box; }
  form { width: min(100%, 320px); background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 28px 22px 22px; display: grid; gap: 14px; box-sizing: border-box; }
  h1 { margin: 0; font-size: 17px; letter-spacing: .2em; color: var(--accent); text-align: center; font-weight: 600; }
  input[type=password] { font: inherit; font-size: 16px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); }
  input[type=password]:focus { outline: 2px solid var(--accent); outline-offset: 0; }
  label { display: flex; gap: 6px; align-items: center; font-size: 13px; color: var(--muted); }
  button { font: inherit; font-size: 15px; letter-spacing: .16em; padding: 11px; border: 0; border-radius: 999px; background: var(--accent); color: var(--paper); cursor: pointer; }
  button:disabled { opacity: .6; }
  .msg { min-height: 1.4em; margin: 0; font-size: 13px; color: var(--bad); text-align: center; }
  [hidden] { display: none !important; }
</style>
</head>

  <p class="msg" id="msg" aria-live="polite"></p>
</form>

  const KEY = "pm-cards-unlock-v1";
  const $ = (id) => document.getElementById(id);
  const un64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const to64 = (b) => btoa(String.fromCharCode(...new Uint8Array(b)));
  const ct = un64(D.c), tag = un64(D.t);

  async function derive(pw) {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
    return new Uint8Array(await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: un64(D.s), iterations: D.i }, base, 640));
  }
  async function unlock(dk) {
    const mac = await crypto.subtle.importKey("raw", dk.slice(48), { name: "HMAC", hash: "SHA-256" }, false, ["verify"]);
    if (!(await crypto.subtle.verify("HMAC", mac, tag, ct))) return null;
    const key = await crypto.subtle.importKey("raw", dk.slice(0, 32), "AES-CBC", false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({ name: "AES-CBC", iv: dk.slice(32, 48) }, key, ct);
    return new TextDecoder().decode(plain);
  }

    document.open();
    document.write(html);
    document.close();
  }
  function forget() { try { localStorage.removeItem(KEY); } catch (e) {} }

    go.disabled = true;
    msg.textContent = "";
    go.textContent = "解锁中…";
    let html = null;
    try {
      const dk = await derive(pw);
      html = await unlock(dk);
      if (html) {
        if ($("keep").checked) { try { localStorage.setItem(KEY, to64(dk)); } catch (e) {} }
        else forget();
      } else {
        msg.textContent = "密码不对";
        $("pw").select();
      }
    } catch (err) {
      msg.textContent = "解锁出错了，刷新再试一次";
    }
    go.disabled = false;
    go.textContent = "打开";
    if (html) show(html);
  });
})();
</script>
</body>
</html>
